project_name: skyfire

before:
  hooks:
    - bash -c "cd backend && go mod tidy"
    - bash -c "cd frontend && pnpm install --frozen-lockfile && pnpm build"
    - mkdir -p backend/internal/web/dist
    - cp -r frontend/dist/index.html frontend/dist/assets backend/internal/web/dist/

builds:
  - dir: backend
    main: ./cmd/skyfired
    binary: skyfired
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: binary
    name_template: "skyfired-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"