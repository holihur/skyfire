version: 2

project_name: skyfire

before:
  hooks:
    - bash -c "cd backend && go mod tidy"
    - bash -c "cd client && go mod tidy"
    - bash -c "cd frontend && pnpm install --frozen-lockfile && pnpm build"
    - mkdir -p backend/internal/web/dist
    - cp -r frontend/dist/index.html frontend/dist/assets backend/internal/web/dist/

builds:
  - id: skyfired
    dir: backend
    main: ./cmd/skyfired
    binary: skyfired
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  # Desktop client. Windows uses the fyne tray/dialogs and therefore needs cgo
  # (mingw-w64) — see the overrides below; Linux is the terminal build (no cgo).
  # macOS also uses fyne and is built on a macOS runner by the release workflow.
  - id: skyfire-client
    dir: client
    main: .
    binary: skyfire-client
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Set CGO_ENABLED explicitly per target so the result never depends on
    # whether goreleaser merges or replaces override env.
    overrides:
      - goos: windows
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=x86_64-w64-mingw32-gcc
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=0
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=0

archives:
  - id: skyfired
    ids: [skyfired]
    formats: [binary]
    name_template: "skyfired-{{ .Os }}-{{ .Arch }}"
  - id: skyfire-client
    ids: [skyfire-client]
    formats: [binary]
    name_template: "skyfire-client-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
