version: 2

project_name: skyfire

before:
  hooks:
    - bash -c "cd backend && go mod tidy"
    - bash -c "cd client && go mod tidy"
    - bash -c "cd frontend && pnpm install --frozen-lockfile && pnpm build"
    - mkdir -p backend/internal/web/dist
    - cp -r frontend/dist/index.html frontend/dist/assets backend/internal/web/dist/

builds:
  - id: skyfired
    dir: backend
    main: ./cmd/skyfired
    binary: skyfired
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  # Desktop client. Windows is built here (pure Go, tray included). macOS
  # needs cgo (systray/Cocoa) and is built on a macOS runner by the release
  # workflow, then attached to the same release.
  - id: skyfire-client
    dir: client
    main: .
    binary: skyfire-client
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
    goarch:
      - amd64

archives:
  - id: skyfired
    ids: [skyfired]
    formats: [binary]
    name_template: "skyfired-{{ .Os }}-{{ .Arch }}"
  - id: skyfire-client
    ids: [skyfire-client]
    formats: [binary]
    name_template: "skyfire-client-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
