name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (install + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  release:
    name: Release binaries (tags only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Build web UI
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Embed web UI
        run: mkdir -p internal/web/dist && cp -r ../frontend/dist/index.html ../frontend/dist/assets internal/web/dist/
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/skyfired-$os-$arch ./cmd/skyfired
            done
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyfired-binaries
          path: backend/dist/*
      - name: Tag structure check
        run: echo "release binaries built for tag $GITHUB_REF_NAME"