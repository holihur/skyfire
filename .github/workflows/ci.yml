name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (install + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  windows:
    name: Windows binary (cross-compile + wine smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Cross-compile (compile check for every GOOS/GOARCH)
        run: |
          cd backend
          # windows/arm64 excluded: goreleaser ignore aligns with no release artifact (Issue #10)
          for target in "windows/amd64" "darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64"; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /tmp/build-ok ./cmd/skyfired
          done
      - name: Build Windows amd64 binary
        run: |
          cd backend
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/skyfired.exe ./cmd/skyfired
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 >/dev/null 2>&1 || true
          wine --version 2>/dev/null || which wine || echo "wine unavailable"
      - name: Smoke test under Wine
        run: bash deploy/test-windows.sh /tmp/skyfired.exe

  release:
    name: Release (goreleaser)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}